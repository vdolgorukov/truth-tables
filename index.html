<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=JSON.parse(localStorage.getItem("tt-theme"));if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Тренажёр таблиц истинности</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- math font only for connective glyphs; letters stay in PT Mono -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Math&text=%C2%AC%E2%88%A7%E2%88%A8%E2%86%92%E2%86%94%E2%8A%BB%E2%86%93%E2%8A%A4%E2%8A%A5%E2%8A%A8%E2%86%90%E2%86%9B%E2%8A%95&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --paper:#ffffff;
  --text:#22252d;
  --muted:#5f6576;
  --rule:#dde0e8;
  --rule-strong:#a3a9b8;
  --accent:#34438b;
  --on-accent:#ffffff;
  --ok:#2c7a4b;
  --err:#9c4a00;
  --ok-bg:#e2f2e8;
  --err-bg:#ffe1a8;
  --tv:#1b7a3d;
  --fv:#c23a2c;
  --good-bg:#e3e9f6;
  --prem-bg:#cfd9f5;
  --src-bg:#fdf1c9;
  --tint:#f3f5fa;
  --key-bg:#dfe5f0; --key-bg-hover:#cfd8ea; --key-border:#aab5cc;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16181d; --text:#e4e6ec; --muted:#9aa0b1;
    --rule:#2d313c; --rule-strong:#565c6e; --accent:#a4b3f2; --on-accent:#141826;
    --ok:#66c48b; --err:#ffb35c; --ok-bg:#1c3326; --err-bg:#4a3313; --src-bg:#3a3321; --tv:#6fd394; --fv:#ff8a7a; --good-bg:#232f48; --prem-bg:#2f3f6e;
    --tint:#1e2129; --key-bg:#2b3244; --key-bg-hover:#353e55; --key-border:#4b5670; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16181d; --text:#e4e6ec; --muted:#9aa0b1;
  --rule:#2d313c; --rule-strong:#565c6e; --accent:#a4b3f2; --on-accent:#141826;
  --ok:#66c48b; --err:#ffb35c; --ok-bg:#1c3326; --err-bg:#4a3313; --src-bg:#3a3321; --tv:#6fd394; --fv:#ff8a7a; --good-bg:#232f48; --prem-bg:#2f3f6e;
  --tint:#1e2129; --key-bg:#2b3244; --key-bg-hover:#353e55; --key-border:#4b5670; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--paper);color:var(--text);
  font-family:"PT Serif",Georgia,"Times New Roman",serif;
  font-size:1.0625rem;line-height:1.6;-webkit-text-size-adjust:100%;
}
main{max-width:1120px;margin:0 auto;padding:2.25rem 1.5rem 4.5rem}
.report{
  position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;
  font-size:.82rem;line-height:1.2;padding:.4rem .8rem;border-radius:999px;text-decoration:none;
  background:var(--key-bg);border:1px solid var(--key-border);color:var(--muted);box-shadow:0 1px 4px rgba(20,30,60,.15);
}
.report:hover{color:var(--accent);border-color:var(--accent)}
.report:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){main{padding:1.5rem 1rem 2.5rem}}
h1{font-size:clamp(1.55rem,1.2rem + 1.4vw,2.1rem);line-height:1.2;font-weight:700;margin:0 0 .45rem;text-wrap:balance}
h2{font-size:1.05rem;font-weight:700;margin:0}
.lead{margin:0;color:var(--muted);max-width:66ch}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.mono{font-family:"Noto Sans Math","PT Mono",ui-monospace,Menlo,Consolas,monospace}

.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--rule-strong);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:.9rem;min-width:44px;min-height:36px;padding:0 .75rem;border:0;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button + button{border-left:1.5px solid var(--rule-strong)}
.seg button:hover{color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.topctl{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.5rem;margin-top:.3rem;flex-shrink:0}
.theme button{font-size:.85rem;padding:0 .7rem}
@media (max-width:640px){.top{flex-direction:column}.topctl{justify-content:flex-start}}
.lang button{letter-spacing:.04em;font-size:.85rem;padding:0 .6rem}

.btn{
  font:inherit;font-size:.97rem;min-height:40px;padding:.4rem 1rem;border-radius:6px;cursor:pointer;
  border:1.5px solid var(--accent);background:transparent;color:var(--accent);
}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:var(--rule-strong);color:var(--muted)}
.btn:focus-visible,summary:focus-visible,.chip:focus-visible,.key:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* formula entry */
.entry{margin:1.6rem 0 0;display:grid;gap:.7rem}
.entry label{color:var(--muted);font-size:.9rem;letter-spacing:.04em;text-transform:uppercase}
.frow{display:flex;gap:.6rem;flex-wrap:wrap}
#f-input{
  flex:1 1 18rem;min-width:0;font-family:"Noto Sans Math","PT Mono",ui-monospace,Menlo,monospace;font-size:1.3rem;
  padding:.45rem .7rem;border:1.5px solid var(--rule-strong);border-radius:6px;background:var(--paper);color:var(--text);
}
#f-input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.keys{display:flex;flex-wrap:wrap;gap:.4rem}
.key{
  font-family:"Noto Sans Math","PT Mono",ui-monospace,Menlo,monospace;font-size:1.08rem;min-width:44px;min-height:40px;padding:0 .55rem;
  border:1.5px solid var(--key-border);border-radius:6px;background:var(--key-bg);color:var(--text);cursor:pointer;
}
.key:hover{background:var(--key-bg-hover);border-color:var(--accent);color:var(--accent)}
.key.aux{font-family:"PT Serif",Georgia,serif;font-size:.9rem;color:var(--muted)}
.keys .gap{width:.6rem}
/* connective and constant glyphs come from one math font, so all keys match in size and weight */
.key.sym{font-family:"Noto Sans Math","PT Mono",ui-monospace,monospace;font-size:1.2rem;line-height:1}
.preview{min-height:1.6em;font-size:.97rem;color:var(--muted)}
.preview .f{font-family:"Noto Sans Math","PT Mono",ui-monospace,monospace;color:var(--text)}
.preview.err{color:var(--err)}
.preview.err .src{font-family:"Noto Sans Math","PT Mono",ui-monospace,monospace;color:var(--text);white-space:pre-wrap}
.preview mark{background:var(--err-bg);color:var(--err);border-bottom:2px solid var(--err);padding:0 .1em}
.preview .stale{color:var(--accent)}
.bigwarn{padding:.5rem .8rem;border-radius:6px;background:var(--src-bg);color:var(--text);display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .8rem}
.btn.sm{min-height:32px;padding:.15rem .75rem;font-size:.9rem}
.examples{display:flex;flex-wrap:wrap;gap:.4rem .5rem;align-items:center;font-size:.92rem;margin-top:.6rem}
.examples > span{color:var(--muted)}
.chip{
  font-family:"Noto Sans Math","PT Mono",ui-monospace,monospace;font-size:.88rem;padding:.2rem .6rem;min-height:32px;
  border:1px solid var(--rule);border-radius:999px;background:var(--tint);color:var(--text);cursor:pointer;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}

details{border-top:1px solid var(--rule);padding-top:.6rem}
summary{cursor:pointer;color:var(--accent);width:max-content;max-width:100%}
.help{margin-top:.6rem;display:grid;gap:.8rem;font-size:.95rem}
.help p{margin:0;max-width:70ch}
.help-wrap{overflow-x:auto}
.help table{border-collapse:collapse;font-size:.92rem}
.help th,.help td{padding:.3rem .8rem .3rem 0;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.help th{font-weight:400;color:var(--muted)}
.help td.sym{font-size:1.15rem}
.sem{margin-top:.6rem;display:grid;gap:1rem;font-size:.95rem}
.sem h3{font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:400;margin:0}
.sem p{margin:0;max-width:72ch}
.sem .tw{overflow-x:auto}
.sem table{border-collapse:collapse;font-family:"Noto Sans Math","PT Mono",ui-monospace,monospace;font-size:.95rem;font-variant-numeric:tabular-nums}
.sem th,.sem td{border:1px solid var(--rule);padding:.25rem .6rem;text-align:center}
.sem thead th{background:var(--tint);font-weight:400}
.sem th.lt,.sem td.lt{border-right:3px double var(--rule-strong)}
.sem td.txt,.sem th.txt{font-family:"PT Serif",Georgia,serif;text-align:left}
.sem .v1{color:var(--tv)}
.sem .v0{color:var(--fv)}
.sem dl{margin:0;display:grid;gap:.45rem;max-width:80ch}
.sem dt{font-weight:700;display:inline}
.sem dd{display:inline;margin:0}
.sem dl > div{line-height:1.5}
.sem .mono{font-family:"Noto Sans Math","PT Mono",ui-monospace,monospace}
.help code{font-family:"Noto Sans Math","PT Mono",ui-monospace,monospace;font-size:.88rem;background:var(--tint);padding:.05rem .3rem;border-radius:4px;white-space:nowrap}

/* settings */
/* Examples / How to type / Settings: one row of toggles, panels open underneath */
.drawers{display:flex;flex-wrap:wrap;gap:.2rem 1.5rem;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:.35rem 0}
.drawer-btn{font:inherit;font-size:.88rem;color:var(--accent);background:none;border:0;padding:.2rem 0;cursor:pointer;min-height:30px}
.drawer-btn::before{content:"▸";display:inline-block;width:1em}
.drawer-btn[aria-expanded="true"]::before{content:"▾"}
.drawer-btn[aria-expanded="true"]{font-weight:700}
.drawer-btn:hover span{text-decoration:underline;text-underline-offset:2px}
.drawer-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{padding:.1rem 0 .75rem;border-bottom:1px solid var(--rule)}
.settings{display:flex;flex-wrap:wrap;gap:1rem 1.6rem;margin:.9rem 0 .4rem}
.opt{display:grid;gap:.35rem;align-content:start}
.opt > span{color:var(--muted);font-size:.8rem;letter-spacing:.05em;text-transform:uppercase}
.seg .mono{font-size:.88rem}
.opt > .seg{justify-self:start}
.custom-sym{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.88rem;color:var(--muted)}
.custom-sym input{font-family:"PT Mono",ui-monospace,monospace;font-size:.95rem;width:5.5ch;padding:.15rem .3rem;margin-left:.25rem;border:1.5px solid var(--rule-strong);border-radius:5px;background:var(--paper);color:var(--text);text-align:center}
.custom-sym input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.custom-sym input.bad{border-color:var(--err);background:var(--err-bg)}

/* work area */
.work{margin-top:1.6rem;display:grid;gap:1rem}
.status{display:flex;flex-wrap:wrap;gap:.45rem .6rem;align-items:center;font-size:.93rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.15rem .7rem;border-radius:999px;border:1px solid var(--rule);background:var(--tint);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.ok{color:var(--ok);border-color:currentColor;background:var(--ok-bg)}
.pill.err{color:var(--err);border-color:currentColor;background:var(--err-bg)}
.missing{flex-basis:100%;color:var(--err)}
.missing .mono{color:var(--text)}
.result{display:flex}
.banner{flex-basis:100%;padding:.6rem .9rem;border-radius:6px;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.banner b{font-weight:700}
.banner .neg{color:var(--err);font-weight:700}
.quiz{margin-top:.6rem;padding:.75rem .9rem;border-radius:6px;background:var(--paper);color:var(--text);border:1px solid var(--rule);display:grid;gap:.75rem}
.quiz .q{font-weight:700}
.pair{border:1px solid var(--rule);border-radius:6px;padding:.4rem .75rem .65rem;margin:0;min-width:0;display:grid;gap:.5rem}
.pair legend{padding:0 .3rem}
.pair.ok{border-color:var(--ok)}
.pair.bad{border-color:var(--err)}
.opts{display:flex;flex-wrap:wrap;gap:.4rem}
.qopt{display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .7rem;min-height:34px;border:1.5px solid var(--key-border);border-radius:999px;background:var(--key-bg);cursor:pointer;font-size:.92rem}
.qopt input{margin:0;accent-color:var(--accent)}
.qopt:has(input:disabled){cursor:default}
.qopt.right{border-color:var(--ok);background:var(--ok-bg)}
.qopt.wrong{border-color:var(--err);background:var(--err-bg)}
.qopt.missed{border-style:dashed;border-color:var(--ok)}
.qres.ok{color:var(--ok)}
.qres.bad{color:var(--err)}
.qscore{font-weight:700}
.qbtns{margin-top:.6rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .8rem}
.qwarn{color:var(--err);font-size:.92rem}
.banner ul{margin:.3rem 0 .4rem;padding-left:1.2rem}
.muted-line{flex-basis:100%;color:var(--muted);font-style:italic}

.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:.25rem}
table.tt{border-collapse:collapse;font-family:"Noto Sans Math","PT Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:1.05rem}
.tt th,.tt td{border:1px solid var(--rule);padding:0;text-align:center;position:relative}
.tt thead th{padding:.45rem .75rem;font-weight:400;white-space:nowrap;background:var(--tint);border-bottom:2px solid var(--rule-strong)}
.tt thead th.main{font-weight:700;color:var(--accent)}
.tt th.rn{font-family:"PT Serif",Georgia,serif;font-size:.85rem;color:var(--muted);padding:0 .55rem;font-weight:400;background:var(--tint)}
.tt .lastL{border-right:4px double var(--rule-strong)}
.tt .gsep,.tt.inline td.fp.gsep,.tt.inline th.fp.gsep{border-left:4px double var(--rule-strong)}
.tt .gconcl,.tt.inline td.fp.gconcl,.tt.inline th.fp.gconcl{border-left:6px solid var(--accent)}
.tt tr.counter th.rn{color:var(--err);font-weight:700;box-shadow:inset 4px 0 0 var(--err)}
.tt tr.prem th.rn{color:var(--accent);font-weight:700;box-shadow:inset 4px 0 0 var(--accent)}
/* rows where all premises are true are tinted; counterexamples among them get the error tint */
.tt tr.prem > td:not(.note),.tt tr.prem > th.rn{background:var(--prem-bg)}
.tt tr.counter > td:not(.note),.tt tr.counter > th.rn{background:var(--err-bg)}
.tt tr.counter td.note{font-weight:700}
.rel{margin:.3rem 0 .4rem;padding-left:1.2rem}
.rel li{margin:.15rem 0}
.tt th.note,.tt td.note{border:0;background:transparent;text-align:left;padding:0 .7rem;font-family:"PT Serif",Georgia,serif;font-size:.86rem;white-space:nowrap}
.tt td.note{color:var(--err)}
.tt td.note.info{color:var(--muted);font-style:italic}
.cell{
  display:block;width:100%;min-width:2.75rem;height:2.4rem;border:0;margin:0;padding:0 .5rem;
  background:transparent;font:inherit;color:var(--text);cursor:pointer;
}
.cell:hover{background:var(--tint)}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
span.cell{display:grid;place-items:center;cursor:default;color:var(--muted)}
span.cell:hover{background:transparent}
/* value colour (true / false) and check result (correct / wrong) use separate channels:
   text colour for the value, background + outline + corner mark for the result */
.cell.v1{color:var(--tv)}
.cell.v0{color:var(--fv)}
.tt td.ok{background:var(--good-bg)}
.tt td.err{background:var(--err-bg);box-shadow:inset 0 0 0 2px var(--err)}
.tt td.err .cell{font-weight:700}
.tt td.err::after{content:"";position:absolute;top:0;right:0;border:6px solid transparent;border-top-color:var(--err);border-right-color:var(--err);pointer-events:none}
.tt td.dup{background:var(--err-bg)}
.tt tr.dup th.rn{color:var(--err);font-weight:700}
.tt.inline .fp{border-left:0;border-right:0}
.tt.inline thead th.fp{padding:.45rem .08rem;font-size:1.1rem}
/* order-of-operations numbers above the connectives / column headers */
.tt thead .ord{display:block;font-family:"PT Serif",Georgia,serif;font-size:.68rem;line-height:1.1;min-height:.75rem;color:var(--muted);font-weight:400}
.tt thead th.main .ord{color:var(--accent);font-weight:700}
.tt thead th:not(.rn):not(.note){vertical-align:bottom}
.tt.inline thead th.fp.op{padding:.45rem .2rem}
.tt.inline thead th.fp.v{padding:.45rem .15rem}
.tt.inline .fp.slot{border-left:1px solid var(--rule-strong);border-right:1px solid var(--rule-strong)}
.tt.inline thead th.fp.slot{padding:.45rem .5rem}
.tt.inline .fp .cell{min-width:2.4rem;padding:0 .15rem}
.tt.inline .lastP{border-right:1px solid var(--rule)}
.tt.inline td.fp.blank{min-width:.5rem}
.tt.inline td.fp.copy .cell{min-width:1.4rem;padding:0 .1rem;color:var(--muted)}
/* values already used for a computation are struck out with a vertical stroke */
/* the crossed-out digit fades; the stroke itself stays clearly visible */
.tt.inline td.used .cell{position:relative;color:color-mix(in srgb,var(--text) 40%,transparent)}
.tt.inline td.used .cell.v1{color:color-mix(in srgb,var(--tv) 40%,transparent)}
.tt.inline td.used .cell.v0{color:color-mix(in srgb,var(--fv) 40%,transparent)}
.tt.inline td.used .cell:not(:empty)::after{content:"";position:absolute;left:50%;top:18%;bottom:18%;width:1.5px;margin-left:-.75px;background:color-mix(in srgb,var(--muted) 55%,transparent);pointer-events:none}
.tt .src{outline:2px dashed var(--accent);outline-offset:-3px}
.tt thead th.src{outline:2px dashed var(--accent);outline-offset:-3px}

.actions{display:flex;flex-wrap:wrap;gap:.6rem}
.tr{display:grid;gap:1rem;margin-top:.8rem}
.tr-tabs{margin-top:.6rem}
.tr-f{display:grid;gap:.35rem}
.tr-f h3{margin:0;font-size:1rem;font-family:"Noto Sans Math","PT Mono",ui-monospace,monospace;font-weight:700}
.tr-row{display:grid;grid-template-columns:minmax(10rem,16rem) minmax(0,1fr);gap:.2rem 1rem;align-items:baseline}
@media (max-width:640px){.tr-row{grid-template-columns:minmax(0,1fr)}}
.tr-row > span:first-child{color:var(--muted);font-size:.9rem}
.tr-row > span:first-child small{display:block;font-size:.78rem;line-height:1.3;opacity:.85}
.tr-row .mono{overflow-wrap:anywhere}
.tr-row .none{color:var(--muted);font-style:italic}
.tr-row .nf{line-height:1.9}
/* a separate bar over each negated variable, so p̄q̄ never reads as the negation of pq */
.frege-wrap{overflow-x:auto;max-width:100%}
.bgtex{display:block;font-family:"PT Mono",ui-monospace,Menlo,monospace;font-size:.84rem;background:var(--tint);border:1px solid var(--rule);border-radius:6px;padding:.35rem .55rem;overflow-wrap:anywhere}
.tr-row:has(.frege-wrap){align-items:start}
.tr-row .bg-copy{display:block;margin-top:.4rem;min-height:0;padding:.1rem .55rem;font-size:.75rem;line-height:1.5;border-width:1px}
.tr-row > span:first-child .bgtex{margin-top:.35rem;font-size:.72rem;color:var(--text)}
.frege{display:block;color:var(--text)}
.peirce{display:block;color:var(--text)}
.peirce .sheet{fill:none;stroke:var(--rule-strong);stroke-width:1;stroke-dasharray:4 3}
.peirce .cut{fill:none;stroke:currentColor;stroke-width:1.6}
.peirce text{fill:currentColor;font-family:"PT Mono",ui-monospace,Menlo,monospace;font-size:15px}
.frege .fl line{stroke:currentColor;stroke-width:1.6;stroke-linecap:square}
.frege .ft text{fill:currentColor;font-family:"PT Mono",ui-monospace,Menlo,monospace;font-size:15px}
.post{display:inline-flex;flex-wrap:wrap;gap:.35rem}
.pp{display:inline-block;padding:.05rem .55rem;border:1px solid var(--rule);border-radius:999px;font-family:"PT Serif",Georgia,serif;font-size:.88rem;color:var(--muted)}
.pp.yes{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.post-note{display:block;margin-top:.3rem;font-size:.9rem;color:var(--accent)}
.ovl{display:inline-block;border-top:1.5px solid currentColor;padding-top:1px;margin:0 1.5px;line-height:1.15}
.export{display:grid;gap:.6rem;margin-top:.6rem}
#exp-fmt{justify-self:start}
#exp-out{width:100%;min-height:11rem;resize:vertical;font-family:"PT Mono",ui-monospace,Menlo,monospace;font-size:.85rem;line-height:1.45;padding:.5rem .65rem;border:1.5px solid var(--rule-strong);border-radius:6px;background:var(--tint);color:var(--text);white-space:pre;overflow:auto}
#exp-out:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

    </div>

    </div>

      </div>
    </details>
  </section>

function PErr(key,pos,len,arg){this.key=key;this.pos=pos;this.len=len||1;this.arg=arg}

function tokenize(s){
  const out=[];let i=0;
  outer: while(i<s.length){
    const ch=s[i];
    if(/\s/.test(ch)){i++;continue}
    if(ch==="("||ch===")"){out.push({k:ch,pos:i,len:1});i++;continue}
    if(ch===","||ch===";"){out.push({k:",",pos:i,len:1});i++;continue}
    if(ch==="{"||ch==="}"){out.push({k:ch,pos:i,len:1});i++;continue}
    if(s.startsWith("\\{",i)||s.startsWith("\\}",i)){out.push({k:s[i+1],pos:i,len:2});i+=2;continue}
    for(const [a,v] of ASCII){
      if(s.startsWith(a,i)){
        if(v==="⊤"||v==="⊥")out.push({k:"const",v:v==="⊤",pos:i,len:a.length});
        else if(v==="⊨")out.push({k:"⊨",pos:i,len:a.length});
        else out.push({k:"op",v,pos:i,len:a.length});
        i+=a.length;continue outer;
      }
    }
    if(ch==="\\"){
      const m=/^\\([A-Za-z]+)/.exec(s.slice(i));
      if(!m)throw new PErr("badChar",i,1,ch);
      const v=LATEX[m[1]];
      if(!v)throw new PErr("badCmd",i,m[0].length,m[1]);
      if(v==="⊤"||v==="⊥")out.push({k:"const",v:v==="⊤",pos:i,len:m[0].length});
      else if(v==="⊨")out.push({k:"⊨",pos:i,len:m[0].length});
      else out.push({k:"op",v,pos:i,len:m[0].length});
      i+=m[0].length;continue;
    }
    if(ch==="v"){out.push({k:"op",v:"∨",pos:i,len:1});i++;continue}
    const mv=/^([A-Za-zА-Яа-яЁё])(?:_?\{?(\d+)\}?|([₀-₉]+))?/.exec(s.slice(i));
    if(mv){
      const idx=mv[2]||(mv[3]?fromSub(mv[3]):"");
      out.push({k:"var",name:mv[1]+toSub(idx),pos:i,len:mv[0].length});
      i+=mv[0].length;continue;
    }
    if(ch==="0"||ch==="1"){out.push({k:"const",v:ch==="1",pos:i,len:1});i++;continue}
    throw new PErr("badChar",i,1,ch);
  }
  return out;
}

function parse(s){
  const toks=tokenize(s);
  if(!toks.length)throw new PErr("empty",0,0);
  let p=0;
  const peek=()=>toks[p];
  const isOp=(...v)=>p<toks.length&&toks[p].k==="op"&&v.includes(toks[p].v);
  function iff(){let a=imp();while(isOp("↔","⊻")){const op=toks[p++].v;a={t:"bin",op,a,b:imp()}}return a}
  function imp(){const a=disj();if(isOp("→","←","↛")){const op=toks[p++].v;return {t:"bin",op,a,b:imp()}}return a}
  function disj(){let a=conj();while(isOp("∨","↓")){const op=toks[p++].v;a={t:"bin",op,a,b:conj()}}return a}
  function conj(){let a=un();while(isOp("∧","|")){const op=toks[p++].v;a={t:"bin",op,a,b:un()}}return a}
  function un(){if(isOp("¬")){p++;return {t:"not",a:un()}}return atom()}
  function atom(){
    const t=peek();
    if(!t)throw new PErr("expectOperand",s.length,1);
    if(t.k==="var"){p++;return {t:"var",name:t.name}}
    if(t.k==="const"){p++;return {t:"const",v:t.v}}
    if(t.k==="("){
      p++;const e=iff();const c=peek();
      if(!c)throw new PErr("expectClose",s.length,1);
      if(c.k!==")")throw new PErr("extra",c.pos,c.len,s.substr(c.pos,c.len));
      p++;return e;
    }
    throw new PErr("expectOperand",t.pos,t.len);
  }
  // premises, premises ⊨ conclusion, or ⊨ conclusion
  const list=[];let entail=false,braces=false;
  const at=k=>p<toks.length&&toks[p].k===k;
  if(at("{")){
    const open=toks[p];braces=true;p++;
    if(!at("}")){list.push(iff());while(at(",")){p++;list.push(iff())}}
    if(!at("}"))throw p<toks.length?new PErr("extra",toks[p].pos,toks[p].len,s.substr(toks[p].pos,toks[p].len)):new PErr("expectBrace",s.length,1);
    p++;
    if(!list.length&&!at("⊨"))throw new PErr("expectOperand",open.pos+1,1);
  }else if(!at("⊨")){list.push(iff());while(at(",")){p++;list.push(iff())}}
  if(at("⊨")){
    entail=true;p++;list.push(iff());
    if(at(","))throw new PErr("conclOne",toks[p].pos,1);
  }
  list.entail=entail;list.braces=braces;
  if(p<toks.length){const t=toks[p];throw new PErr("extra",t.pos,t.len,s.substr(t.pos,t.len))}
  return list;
}

function show(n){
  switch(n.t){
    case "var":return n.name;
    case "const":return n.v?"⊤":"⊥";
    case "not":return "¬"+(n.a.t==="bin"?"("+show(n.a)+")":show(n.a));
    default:{const w=x=>x.t==="bin"?"("+show(x)+")":show(x);return w(n.a)+n.op+w(n.b)}
  }
}
const OPS={"∧":(a,b)=>a&&b,"∨":(a,b)=>a||b,"→":(a,b)=>!a||b,"↔":(a,b)=>a===b,"⊻":(a,b)=>a!==b,"|":(a,b)=>!(a&&b),"↓":(a,b)=>!(a||b),"←":(a,b)=>a||!b,"↛":(a,b)=>a&&!b};
function ev(n,env){
  switch(n.t){
    case "var":return env[n.name];
    case "const":return n.v;
    case "not":return !ev(n.a,env);
    default:return OPS[n.op](ev(n.a,env),ev(n.b,env));
  }
}

/* live replacement while typing */
function liveNorm(str){
  return str
    .replace(/\\([A-Za-z]+)(?=[^A-Za-z])/g,(m,c)=>LATEX[c]||m)
    .replace(/\|=/g,"⊨").replace(/<->|<=>/g,"↔").replace(/->|=>/g,"→")
    .replace(/\/\\/g,"∧").replace(/\\\//g,"∨").replace(/\\&/g,"∧")
    .replace(/&&?/g,"∧").replace(/\|\|/g,"∨").replace(/\^/g,"∧")
    .replace(/-\/>/g,"↛").replace(/<-(?=[^>])/g,"←").replace(/[~!∼]/g,"¬").replace(/-(?=[^>\/])/g,"¬").replace(/\+/g,"⊻")
    .replace(/(\\[A-Za-z]*)|v/g,(m,cmd)=>cmd?m:"∨")
    .replace(/⇒|⊃/g,"→").replace(/⇔|≡/g,"↔").replace(/⊕/g,"⊻").replace(/↑/g,"|")
    .replace(/\s*([∧∨→←↛↔⊻|↓])\s*/g,"$1").replace(/¬\s+/g,"¬").replace(/\(\s+/g,"(").replace(/\s+\)/g,")").replace(/\s*([,;])(?=\S)/g,"$1 ").replace(/\\([{}])/g,"$1").replace(/\{\s+/g,"{").replace(/\s+\}/g,"}").replace(/\s*⊨\s*/g," ⊨ ").replace(/^ ⊨/,"⊨");
}

/* ---------- model ---------- */
/* Several formulas (separated by commas) share one left side; each gets its own
   group of subformula columns and its own written-out block. */
function buildModel(input){
  const asts=Array.isArray(input)?input:[input];
  const vs=new Set();
  const collect=n=>{if(n.t==="var")vs.add(n.name);else if(n.t==="not")collect(n.a);else if(n.t==="bin"){collect(n.a);collect(n.b)}};
  asts.forEach(collect);
  // by letter, then by numeric index: p, p₁, p₂, p₁₀
  const vkey=v=>[v[0],fromSub(v.slice(1))];
  const vars=[...vs].sort((a,b)=>{const [la,ia]=vkey(a),[lb,ib]=vkey(b);return la!==lb?la.localeCompare(lb):(ia===""?-1:+ia)-(ib===""?-1:+ib)});
  const cols=[],pieces=[],islots=[],groups=[];
  asts.forEach((ast,g)=>{
    const idx=new Map();
    (function w(n){
      if(n.t==="not")w(n.a);else if(n.t==="bin"){w(n.a);w(n.b)}else return;
      const k=show(n);if(!idx.has(k)){idx.set(k,cols.length);cols.push({node:n,key:k,g})}
    })(ast);
    if(!idx.size){idx.set(show(ast),cols.length);cols.push({node:ast,key:show(ast),g})}
    for(const c of cols){
      if(c.g!==g)continue;
      const ch=c.node.t==="not"?[c.node.a]:c.node.t==="bin"?[c.node.a,c.node.b]:[];
      c.kids=ch.map(x=>x.t==="var"?"L"+vars.indexOf(x.name):x.t==="const"?null:"R"+idx.get(show(x))).filter(Boolean);
      if(c.node.t==="var")c.kids=["L"+vars.indexOf(c.node.name)];
    }
    // written-out formula: one piece per symbol, one slot per connective occurrence
    const p0=pieces.length,s0=islots.length;
    const kidIds=i=>pieces[i].c==="v"?["P"+i,"L"+pieces[i].vj]:["P"+i];
    function lay(n,paren){
      if(paren)pieces.push({t:"(",c:"par",g});
      let at,kids=[];
      if(n.t==="var"){at=pieces.length;pieces.push({t:n.name,c:"v",vj:vars.indexOf(n.name),g})}
      else if(n.t==="const"){at=pieces.length;pieces.push({t:n.v?"⊤":"⊥",c:"k",g})}
      else if(n.t==="not"){at=pieces.length;pieces.push({t:"¬",c:"op",g});kids=[lay(n.a,n.a.t==="bin")]}
      else{const a=lay(n.a,n.a.t==="bin");at=pieces.length;pieces.push({t:n.op,c:"op",g});kids=[a,lay(n.b,n.b.t==="bin")]}
      if(kids.length)islots.push({node:n,piece:at,kids:kids.flatMap(kidIds)});
      if(paren)pieces.push({t:")",c:"par",g});
      return at;
    }
    const rootAt=lay(ast,false);
    if(islots.length===s0)islots.push({node:ast,piece:rootAt,kids:ast.t==="var"?["L"+vars.indexOf(ast.name)]:[]});
    pieces[p0].first=true;
    // order of operations: connectives numbered in the order they are computed (inner first)
    let ord=0;
    for(let i=s0;i<islots.length;i++){const x=islots[i];if(x.node.t==="not"||x.node.t==="bin"){x.ord=++ord;pieces[x.piece].ord=ord}}
    // a single connective needs no number
    if(ord===1)for(let i=s0;i<islots.length;i++){delete islots[i].ord;delete pieces[islots[i].piece].ord}
    ord=0;cols.forEach(c=>{if(c.g===g&&(c.node.t==="not"||c.node.t==="bin"))c.ord=++ord});
    if(ord===1)cols.forEach(c=>{if(c.g===g)delete c.ord});
    groups.push({ast,text:show(ast),main:idx.get(show(ast)),mainI:islots.length-1});
  });
  cols.forEach((c,i)=>{c.first=i===0||cols[i-1].g!==c.g});
  const entail=!!input.entail,prem=groups.slice(0,entail?-1:groups.length).map(x=>x.text).join(", ");
  const premTxt=input.braces?"{"+prem+"}":prem;
  const text=entail?(premTxt?premTxt+" ":"")+"⊨ "+groups[groups.length-1].text:premTxt;
  return {asts,groups,text,entail,concl:entail?groups.length-1:-1,vars,cols,n:1<<vars.length,pieces,islots,
    mains:new Set(groups.map(x=>x.main)),mainsI:new Set(groups.map(x=>x.mainI))};
}
const k=()=>S.model.vars.length;
const visCols=()=>S.cols==="main"?S.model.groups.map(x=>x.main):S.model.cols.map((_,i)=>i);
function lexVal(r,j){const bit=(r>>(k()-1-j))&1;return S.order==="asc"?bit===1:bit===0}
function leftVal(r,j){return S.auto?lexVal(r,j):S.left[r][j]}
const sym=v=>v==null?"":SYM[S.notation][v?1:0];
function paint(el,v){el.textContent=sym(v);el.classList.toggle("v1",v===true);el.classList.toggle("v0",v===false)}

function setCaret(p){inp.focus();inp.setSelectionRange(p,p)}
function insertAtCaret(t){
  const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s,v=inp.value;

// deleting must not trigger auto-corrections, otherwise the spaces around ⊨ (and after a comma)
// come straight back and the symbol next to them can never be removed
function onFormulaInput(deleting){
  S.showErr=false;
  const v=inp.value,c=inp.selectionStart??v.length;
  if(!deleting){
    const a=liveNorm(v.slice(0,c)),b=liveNorm(v.slice(c));
    if(a+b!==v){inp.value=a+b;inp.setSelectionRange(a.length,a.length)}

}
inp.addEventListener("input",e=>{if(e.isComposing)return;onFormulaInput(/^delete/.test(e.inputType||""))});

function renderPreview(){
  const s=inp.value;
  try{
    const ast=parse(s);const m=buildModel(ast);
    if(m.vars.length>MAX_VARS)throw new PErr("tooMany",0,0,m.vars.length);
    const stale=!S.model||m.text!==S.model.text;
    preview.className="preview";
    // a formula that parses shows nothing here; only errors and the large-table warning
    let html="";
    if(m.vars.length>SAFE_VARS&&(stale||S.askBig===m.text)){
      html+="<div class=\"bigwarn\">"+esc(L().bigWarn(m.vars.length,m.n));
      if(S.askBig===m.text)html+=" <button type=\"button\" class=\"btn sm\" id=\"big-go\">"+esc(L().bigGo(m.n))+"</button>";
      html+="</div>";
    }
    preview.innerHTML=html;preview.hidden=!html;
    return ast;
  }catch(e){
    if(!(e instanceof PErr))throw e;
    // parse errors are shown only after "Build table", not while typing
    if(!S.showErr){preview.innerHTML="";preview.hidden=true;return null}
    preview.className="preview err";
    let html=esc(L().err[e.key](e.arg));
    if(e.key!=="empty"&&e.key!=="tooMany"){
      const before=s.slice(0,e.pos),mid=s.slice(e.pos,e.pos+e.len)||" ",after=s.slice(e.pos+e.len);
      html+=" <span class=\"src\">"+esc(before)+"<mark>"+esc(mid)+"</mark>"+esc(after)+"</span>";
    }
    preview.innerHTML=html;preview.hidden=false;
    return null;
  }
}

function build(force){
  S.showErr=true;
  const ast=renderPreview();
  if(!ast){inp.focus();return}
  const m=buildModel(ast);
  // big tables need an explicit second click
  if(m.vars.length>SAFE_VARS&&force!==true){S.askBig=m.text;renderPreview();const b=$("big-go");if(b)b.focus();return}
  S.askBig=null;
  if(m.vars.length>SAFE_VARS){preview.textContent="…";preview.hidden=false;setTimeout(()=>{setModel(m);save("formula",inp.value)},30);return}
  setModel(m);
  save("formula",inp.value);
}
/* the task lives in the address: …/truth-tables/?f=<formula> */
const PAGES_URL="https://vdolgorukov.github.io/truth-tables/";
function taskUrl(text){
  const here=/github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)?location.origin+location.pathname:PAGES_URL;
  return here+"?f="+encodeURIComponent(text);
}
function setModel(m,restore){
  try{if(/^https?:$/.test(location.protocol)&&/github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname))history.replaceState(null,"",taskUrl(m.text))}catch(e){}
  S.model=m;S.checked=false;S.quiz=newQuiz();S.lastFilled=null;
  emptyGrids();
  const fits=(g,h,w)=>Array.isArray(g)&&g.length===h&&(h===0||(Array.isArray(g[0])&&g[0].length===w));
  if(restore&&restore.text===m.text&&fits(restore.left,m.n,m.vars.length)&&fits(restore.right,m.n,m.cols.length)){
    S.left=restore.left;S.right=restore.right;
    if(fits(restore.rightI,m.n,m.islots.length))S.rightI=restore.rightI;
  }
  renderTable();renderPreview();
}

/* Random practice formula. Laws (tautologies) and contradictions come up much more often
   than they would by chance: 35% laws, 25% contradictions, 40% any formula. Random search
   first; if it finds nothing suitable, a well-known law (or its negation) is used. */
const LAWS=["(p→q)↔(¬q→¬p)","¬(p∧q)↔¬p∨¬q","¬(p∨q)↔¬p∧¬q","((p→q)→p)→p","(p→q)∧(q→r)→(p→r)","p∧(p→q)→q","(p→q)∧¬q→¬p",
  "(p∨q)∧¬p→q","¬¬p↔p","(p∧q→r)↔(p→(q→r))","p∧(q∨r)↔p∧q∨p∧r","p∨p∧q↔p","(p→q)↔¬p∨q","p→(q→p)","(p→(q→r))→((p→q)→(p→r))"];
function formulaKind(ast){
  const m=buildModel(ast),K=m.vars.length;let t=0;
  for(let x=0;x<m.n;x++){const env={};m.vars.forEach((v,j)=>env[v]=((x>>(K-1-j))&1)===1);if(ev(ast,env))t++}
  return t===m.n?"taut":t===0?"contr":"sat";
}
function randomFormula(){
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const ops=["∧","∨","→","↔","∧","∨","→"];
  const x=Math.random(),want=x<.35?"taut":x<.6?"contr":"any";
  for(let tries=0;tries<4000;tries++){
    const vars=["p","q","r"].slice(0,2+Math.floor(Math.random()*2));
    const gen=d=>{
      if(d===0||(d<3&&Math.random()<.3))return Math.random()<.2?{t:"not",a:{t:"var",name:pick(vars)}}:{t:"var",name:pick(vars)};
      if(Math.random()<.18)return {t:"not",a:gen(d-1)};
      return {t:"bin",op:pick(ops),a:gen(d-1),b:gen(d-1)};
    };
    const ast=gen(3);if(ast.t!=="bin")continue;
    const m=buildModel(ast);
    if(m.vars.length!==vars.length||m.cols.length<3||m.cols.length>6)continue;
    if(want==="any"||formulaKind(ast)===want)return m.text;
  }
  const law=pick(LAWS);
  return want==="contr"?"¬("+law+")":law;
}

/* ---------- table ---------- */
/* A slot is one editable right-hand cell per row: a subformula column (s="R")
   or a position under a connective inside the written-out formula (s="I"). */
function slots(){
  const m=S.model;
  if(S.layout==="cols")return visCols().map(c=>({s:"R",c,td:"R"+c,node:m.cols[c].node,kids:m.cols[c].kids,label:m.cols[c].key,main:m.mains.has(c),sep:sepCls(m.cols[c].g,S.cols==="main"||m.cols[c].first)}));
  const idx=S.cols==="main"?[...m.mainsI]:m.islots.map((_,i)=>i);
  return idx.map(i=>({s:"I",c:i,td:"P"+m.islots[i].piece,node:m.islots[i].node,kids:m.islots[i].kids,label:show(m.islots[i].node),main:m.mainsI.has(i),piece:m.islots[i].piece}))
    .sort((a,b)=>a.piece-b.piece);
}
function sepCls(g,first){if(!first)return "";const m=S.model;return (g>0?" gsep":"")+(g===m.concl?" gconcl":"")}
const store=s=>s==="L"?S.left:s==="R"?S.right:S.rightI;
function cellBtn(s,r,c,label){return "<button type=\"button\" class=\"cell\" data-s=\""+s+"\" data-r=\""+r+"\" data-c=\""+c+"\" aria-label=\""+esc(L().cellLabel(r+1,label))+"\"></button>"}

function rowStart(r){
  const m=S.model,K=m.vars.length;
  let h="<tr data-r=\""+r+"\"><th class=\"rn\" scope=\"row\">"+(r+1)+"</th>";
  for(let j=0;j<K;j++){
    h+="<td class=\""+(j===K-1?"lastL":"")+"\" data-td=\"L"+j+"\">"+(S.auto?"<span class=\"cell\"></span>":cellBtn("L",r,j,m.vars[j]))+"</td>";
  }
  return h;
}

function analyze(){
  const m=S.model,K=m.vars.length,sl=slots();
  const rows=[],groups=new Map();
  for(let r=0;r<m.n;r++){
    const vals=m.vars.map((_,j)=>leftVal(r,j));
    const complete=vals.every(v=>v!=null);
    const key=complete?vals.map(v=>v?1:0).join(""):null;
    const env={};m.vars.forEach((v,j)=>env[v]=vals[j]);
    rows.push({vals,complete,key,env,dupOf:null,cells:{}});
    if(complete){if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)}
  }
  let dupRows=0;
  for(const g of groups.values()){if(g.length>1){for(let i=1;i<g.length;i++){rows[g[i]].dupOf=g[0];dupRows++}rows[g[0]].dupHead=true}}
  const missing=[];
  for(let x=0;x<m.n;x++){
    const key=K?x.toString(2).padStart(K,"0"):"";
    if(!groups.has(key))missing.push(key);
  }
  if(S.order==="desc")missing.reverse();
  let filled=0,errors=0;const total=m.n*sl.length;
  rows.forEach((row,r)=>{
    sl.forEach(x=>{
      const v=store(x.s)[r][x.c];row.cells[x.td]=null;
      if(v==null)return;
      filled++;
      if(!row.complete)return;
      const ok=ev(x.node,row.env)===v;
      row.cells[x.td]=ok?"ok":"err";if(!ok)errors++;
    });
  });
  const allLeft=rows.every(r=>r.complete);
  const done=allLeft&&!missing.length&&filled===total&&errors===0;
  const trues=m.groups.map(()=>0),vecs=m.groups.map(()=>"");
  for(let x=0;x<m.n;x++){
    const env={};m.vars.forEach((v,j)=>env[v]=((x>>(K-1-j))&1)===1);
    m.groups.forEach((g,i)=>{const t=ev(g.ast,env);if(t)trues[i]++;vecs[i]+=t?1:0});
  }
  const jointRows=[];rows.forEach((row,r)=>{if(row.complete&&m.groups.every(g=>ev(g.ast,row.env)))jointRows.push(r+1)});
  const premRows=[],counter=[];
  if(m.entail)rows.forEach((row,r)=>{
    if(!row.complete)return;
    if(m.groups.every((g,i)=>i===m.concl||ev(g.ast,row.env))){premRows.push(r+1);if(!ev(m.groups[m.concl].ast,row.env))counter.push(r+1)}
  });
  return {rows,missing,dupRows,distinct:groups.size,filled,total,errors,allLeft,done,trues,vecs,jointRows,premRows,counter,sl};
}

function update(){
  const m=S.model,A=analyze(),lang=L(),marks=S.checked;
  const trs=table.tBodies[0].rows;
  A.rows.forEach((row,r)=>{
    const tr=trs[r];
    const isDup=!!(marks&&(row.dupOf!=null||row.dupHead));
    tr.classList.toggle("dup",isDup);
    m.vars.forEach((_,j)=>{
      const td=S.cells[r]["L"+j];
      paint(td.firstChild,row.vals[j]);
      td.classList.toggle("dup",isDup&&!S.auto);
    });
    if(S.layout==="inline"){
      m.pieces.forEach((p,i)=>{
        const td=S.cells[r]["P"+i];
        if(td.classList.contains("copy"))paint(td.firstChild,p.c==="v"?row.vals[p.vj]:p.t==="⊤");
      });
      // a value is crossed out once the connective above it has been computed and the
      // student has gone on to fill another cell (the last filled cell keeps its inputs visible)
      const used=new Set();
      // a wrong cell keeps its inputs un-struck so the student can recompute it
      A.sl.forEach(x=>{if(store(x.s)[r][x.c]!=null&&S.lastFilled!==x.s+":"+r+":"+x.c&&!(marks&&row.cells[x.td]==="err"))x.kids.forEach(id=>{if(id[0]==="P")used.add(id)})});
      if(marks)A.sl.forEach(x=>{if(row.cells[x.td]==="err")used.delete(x.td)});
      m.pieces.forEach((p,i)=>S.cells[r]["P"+i].classList.toggle("used",used.has("P"+i)));
    }
    A.sl.forEach(x=>{
      const td=S.cells[r][x.td];
      paint(td.firstChild,store(x.s)[r][x.c]);
      const st=marks?row.cells[x.td]:null;
      td.classList.toggle("ok",st==="ok");td.classList.toggle("err",st==="err");
    });
    const note=tr.lastElementChild;
    note.className="note";
    // entailment: rows where all premises are true, and among them the counterexamples
    const shown=marks&&A.done&&(S.quiz.checked||S.reveal);
    const isCounter=shown&&A.counter.includes(r+1);
    const isPrem=shown&&m.entail&&m.groups.length>1&&A.premRows.includes(r+1);
    tr.classList.toggle("counter",isCounter);
    tr.classList.toggle("prem",isPrem&&!isCounter);
    if(isCounter)note.textContent=lang.noteCounter;
    else if(isPrem)note.textContent="";
    else if(marks&&row.dupOf!=null)note.textContent=lang.noteDup(row.dupOf+1);
    else if(S.checked&&!row.complete){note.textContent=lang.noteEmpty;note.className="note info"}
    else note.textContent="";
  });

  let h="";
  if(!S.auto){
    const good=A.distinct===m.n;
    h+="<span class=\"pill"+(good?" ok":"")+"\">"+esc(lang.sets(A.distinct,m.n))+"</span>";
    if(marks&&A.dupRows)h+="<span class=\"pill err\">"+esc(lang.dups(A.dupRows))+"</span>";
  }
  if(marks)h+="<span class=\"pill"+(A.errors?" err":" ok")+"\">"+esc(lang.errs(A.errors))+"</span>";
  if(marks&&!S.auto&&A.missing.length&&(A.allLeft||S.checked)&&m.vars.length){
    const list=A.missing.slice(0,24).map(key=>"("+key.split("").map(b=>sym(b==="1")).join(", ")+")");
    const more=A.missing.length>24?" … ("+A.missing.length+")":"";
    h+="<div class=\"missing\">"+esc(lang.missing)+" <span class=\"mono\">("+esc(m.vars.join(", "))+")</span>: <span class=\"mono\">"+esc(list.join("  ")+more)+"</span></div>";
  }
  if(!marks)h+="<div class=\"muted-line\">"+esc(lang.hidden)+"</div>";
  // counters stay above the table; the verdict goes under it
  const counters=h;h="";
  if(marks&&A.done)h=verdictHtml(A);
  statusEl.innerHTML=counters;
  resultEl.innerHTML=h;resultEl.hidden=!h;
  if(typeof renderExport==="function")renderExport();
  if(typeof renderTransforms==="function")renderTransforms();
}

/* ---------- verdict and quiz ----------
   Once the table is correct, the student first answers the entailment / relation
   question; the answer and the counterexample rows appear only after "Check answer". */
const REL_OPTS=["equiv","contradict","contrary","subcontrary","sub1","sub-1","indep"];
const relKey=r=>r.kind==="sub"?(r.dir>0?"sub1":"sub-1"):r.kind;
function newQuiz(){return {entail:null,rel:{},checked:false,warn:false}}
function verdictHtml(A){
  if(S.reveal)return answerHtml(A);
  const m=S.model,lang=L(),Q=S.quiz,f=x=>"<span class=\"mono\">"+esc(x)+"</span>";
  const optCls=(chosen,correct)=>"qopt"+(!Q.checked?"":chosen&&correct?" right":chosen?" wrong":correct?" missed":"");
  const btn=Q.checked?"<button type=\"button\" class=\"btn sm\" id=\"q-retry\">"+esc(lang.qRetry)+"</button>"
                     :"<button type=\"button\" class=\"btn sm primary\" id=\"q-check\">"+esc(lang.qCheck)+"</button>";
  let b="<b>"+esc(lang.done)+"</b>";
  if(m.entail){
    const holds=!A.counter.length,noPrem=m.groups.length===1;
    b+="<div class=\"quiz\"><div class=\"q\">"+esc(noPrem?lang.qValid:lang.qEntail)+" "+f(m.text)+"</div><div class=\"opts\">";
    [[true,lang.ansYes],[false,lang.ansNo]].forEach(([v,t])=>{
      b+="<label class=\""+optCls(Q.entail===v,v===holds)+"\"><input type=\"radio\" name=\"q-entail\" value=\""+(v?1:0)+"\""+(Q.entail===v?" checked":"")+(Q.checked?" disabled":"")+"> "+esc(t)+"</label>";
    });
    b+="</div>";
    if(Q.checked){
      const ok=Q.entail===holds;
      const t=noPrem?(holds?lang.validYes:lang.validNo(A.counter)):(holds?lang.entailYes(A.premRows):lang.entailNo(A.counter));
      b+="<div class=\"qres "+(ok?"ok":"bad")+"\"><b>"+esc(ok?lang.qRight:lang.qWrong)+"</b> "+esc(t)+"</div>";
    }
    return "<div class=\"banner\">"+b+btnRow(btn)+"</div></div>";
  }
  if(m.groups.length===1){
    const t=A.trues[0];
    return "<div class=\"banner\">"+b+" "+esc(t===m.n?lang.taut:t===0?lang.contr:lang.sat(t,m.n))+"</div>";
  }
  b+="<ul>";
  m.groups.forEach((g,i)=>{b+="<li>"+f(g.text)+": "+esc(lang.clsShort(A.trues[i],m.n))+"</li>"});
  b+="</ul><div class=\"quiz\"><div class=\"q\">"+esc(lang.qRelHead)+"</div>";
  let right=0,total=0;
  for(let i=0;i<m.groups.length;i++)for(let j=i+1;j<m.groups.length;j++){
    const key=i+"-"+j,A_=m.groups[i].text,B_=m.groups[j].text;
    const rs=relations(A.vecs[i],A.vecs[j]),exp=new Set(rs.map(relKey)),got=Q.rel[key]||new Set();
    const ok=got.size===exp.size&&[...got].every(x=>exp.has(x));
    total++;if(ok)right++;
    b+="<fieldset class=\"pair"+(Q.checked?(ok?" ok":" bad"):"")+"\"><legend>"+f(A_)+" "+esc(lang.and)+" "+f(B_)+"</legend><div class=\"opts\">";
    REL_OPTS.forEach(o=>{
      const label=o==="sub1"?esc(lang.rel.sub)+": "+f(A_+" ⊨ "+B_):o==="sub-1"?esc(lang.rel.sub)+": "+f(B_+" ⊨ "+A_):esc(lang.rel[o]);
      b+="<label class=\""+optCls(got.has(o),exp.has(o))+"\"><input type=\"checkbox\" data-pair=\""+key+"\" value=\""+o+"\""+(got.has(o)?" checked":"")+(Q.checked?" disabled":"")+"> "+label+"</label>";
    });
    b+="</div>";
    if(Q.checked){
      const why=rs.map(r=>"<b>"+esc(lang.rel[r.kind])+"</b> — "+(r.kind==="sub"?f(r.dir>0?A_:B_)+" ⊨ "+f(r.dir>0?B_:A_)+", "+esc(lang.notBack):esc(lang.relWhy[r.kind]))).join("; ");
      b+="<div class=\"qres "+(ok?"ok":"bad")+"\"><b>"+esc(ok?lang.qRight:lang.qWrong)+"</b> "+(ok?"":esc(lang.qAnswer)+" ")+why+"</div>";
    }
    b+="</fieldset>";
  }
  if(Q.checked)b+="<div class=\"qscore\">"+esc(lang.qScore(right,total))+"</div><div>"+esc(A.jointRows.length?lang.joint(A.jointRows):lang.noJoint)+"</div>";
  return "<div class=\"banner\">"+b+btnRow(btn)+"</div></div>";
}
/* the same verdict with the answers shown at once (setting "show at once") */
function answerHtml(A){
  const m=S.model,lang=L(),f=x=>"<span class=\"mono\">"+esc(x)+"</span>";
  let b="<b>"+esc(lang.done)+"</b> ";
  if(m.entail){
    const noPrem=m.groups.length===1,holds=!A.counter.length;
    const t=noPrem?(holds?lang.validYes:lang.validNo(A.counter)):(holds?lang.entailYes(A.premRows):lang.entailNo(A.counter));
    return "<div class=\"banner\">"+b+(holds?esc(t):"<span class=\"neg\">"+esc(t)+"</span>")+"</div>";
  }
  if(m.groups.length===1){const t=A.trues[0];return "<div class=\"banner\">"+b+esc(t===m.n?lang.taut:t===0?lang.contr:lang.sat(t,m.n))+"</div>"}
  b+="<ul>";
  m.groups.forEach((g,i)=>{b+="<li>"+f(g.text)+": "+esc(lang.clsShort(A.trues[i],m.n))+"</li>"});
  b+="</ul><div>"+esc(lang.relHead)+"</div><ul class=\"rel\">";
  for(let i=0;i<m.groups.length;i++)for(let j=i+1;j<m.groups.length;j++){
    const A_=m.groups[i].text,B_=m.groups[j].text;
    b+="<li>"+f(A_)+" "+esc(lang.and)+" "+f(B_)+": "+relations(A.vecs[i],A.vecs[j]).map(r=>
      "<b>"+esc(lang.rel[r.kind])+"</b> — "+(r.kind==="sub"?f(r.dir>0?A_:B_)+" ⊨ "+f(r.dir>0?B_:A_)+", "+esc(lang.notBack):esc(lang.relWhy[r.kind]))).join("; ")+"</li>";
  }
  return "<div class=\"banner\">"+b+"</ul>"+esc(A.jointRows.length?lang.joint(A.jointRows):lang.noJoint)+"</div>";
}
const btnRow=btn=>"<div class=\"qbtns\">"+btn+(S.quiz.warn?"<span class=\"qwarn\">"+esc(S.model.entail?L().qNeedOne:L().qNeed)+"</span>":"")+"</div>";
function quizAnswered(){
  const m=S.model,Q=S.quiz;
  if(m.entail)return Q.entail!==null;
  for(let i=0;i<m.groups.length;i++)for(let j=i+1;j<m.groups.length;j++){const g=Q.rel[i+"-"+j];if(!g||!g.size)return false}
  return true;
}
resultEl.addEventListener("change",e=>{
  const t=e.target,Q=S.quiz;
  if(Q.warn){Q.warn=false;const w=resultEl.querySelector(".qwarn");if(w)w.remove()}
  if(t.name==="q-entail")Q.entail=t.value==="1";
  else if(t.dataset.pair){const set=Q.rel[t.dataset.pair]||(Q.rel[t.dataset.pair]=new Set());t.checked?set.add(t.value):set.delete(t.value)}
});
resultEl.addEventListener("click",e=>{
  if(e.target.id==="q-check"){
    if(!quizAnswered()){S.quiz.warn=true;update();return}
    S.quiz.warn=false;S.quiz.checked=true;update();const r=$("result").querySelector(".qres");if(r)r.scrollIntoView({block:"nearest"})}
  else if(e.target.id==="q-retry"){S.quiz.checked=false;update()}
});

/* Relations between two formulas, from which value pairs (TT, TF, FT, FF) occur.
   Several can hold at once: ⊤ and ⊥ are contradictory and ⊥ ⊨ ⊤ (subordination). */
function relations(a,b){
  let tt=0,tf=0,ft=0,ff=0;
  for(let i=0;i<a.length;i++){const x=a[i]==="1",y=b[i]==="1";if(x&&y)tt++;else if(x)tf++;else if(y)ft++;else ff++}
  if(!tf&&!ft)return [{kind:"equiv"}];
  const out=[];
  if(!tt&&!ff)out.push({kind:"contradict"});
  if(!tt&&ff)out.push({kind:"contrary"});
  if(!ff&&tt)out.push({kind:"subcontrary"});
  if(!tf&&ft)out.push({kind:"sub",dir:1});
  if(!ft&&tf)out.push({kind:"sub",dir:-1});
  if(tt&&tf&&ft&&ff)out.push({kind:"indep"});
  return out;
}

/* ---------- cell interaction ---------- */
function cellAt(s,r,c){return table.querySelector("button[data-s=\""+s+"\"][data-r=\""+r+"\"][data-c=\""+c+"\"]")}
function navCols(){const a=S.auto?[]:S.model.vars.map((_,j)=>({s:"L",c:j}));return a.concat(slots().map(x=>({s:x.s,c:x.c})))}
function setVal(s,r,c,v){
  store(s)[r][c]=v;
  const id=s+":"+r+":"+c;
  if(v!=null)S.lastFilled=id;else if(S.lastFilled===id)S.lastFilled=null;
  S.checked=false;S.quiz.checked=false;
  update();saveProgress();
}
function focusAt(ci,r){const nc=navCols();if(ci<0||ci>=nc.length||r<0||r>=S.model.n)return;const b=cellAt(nc[ci].s,r,nc[ci].c);if(b)b.focus()}
table.addEventListener("click",e=>{
  const b=e.target.closest("button.cell");if(!b)return;
  const s=b.dataset.s,r=+b.dataset.r,c=+b.dataset.c;
  const cur=store(s)[r][c];
  setVal(s,r,c,cur==null?true:cur?false:null);
});
table.addEventListener("keydown",e=>{
  const b=e.target.closest("button.cell");if(!b)return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const s=b.dataset.s,r=+b.dataset.r,c=+b.dataset.c;
  const nc=navCols(),ci=nc.findIndex(x=>x.s===s&&x.c===c);
  let v;
  if(TRUE_KEYS.includes(e.key))v=true;else if(FALSE_KEYS.includes(e.key))v=false;
  else if(S.notation==="custom"&&e.key.length===1){
    const k=e.key.toLowerCase(),t=S.custT[0].toLowerCase(),f=S.custF[0].toLowerCase();
    if(t!==f){if(k===t)v=true;else if(k===f)v=false}
  }
  if(v!==undefined){
    e.preventDefault();setVal(s,r,c,v);
    if(r<S.model.n-1)focusAt(ci,r+1);else if(ci<nc.length-1)focusAt(ci+1,0);
    return;
  }
  switch(e.key){
    case "Backspace":case "Delete":e.preventDefault();setVal(s,r,c,null);return;
    case "ArrowDown":e.preventDefault();focusAt(ci,r+1);return;
    case "ArrowUp":e.preventDefault();focusAt(ci,r-1);return;
    case "ArrowLeft":e.preventDefault();focusAt(ci-1,r);return;
    case "ArrowRight":e.preventDefault();focusAt(ci+1,r);return;
  }
});
function clearSrc(){table.querySelectorAll(".src").forEach(x=>x.classList.remove("src"))}
table.addEventListener("focusin",e=>{
  clearSrc();
  const b=e.target.closest("button.cell");if(!b||b.dataset.s==="L")return;
  const m=S.model,c=+b.dataset.c;
  const kids=b.dataset.s==="R"?m.cols[c].kids:m.islots[c].kids;

    const th=table.querySelector("[data-h=\""+id+"\"]");if(th)th.classList.add("src");
  }
});
table.addEventListener("focusout",e=>{if(!table.contains(e.relatedTarget))clearSrc()});

/* ---------- Polish notation, full DNF / CNF, Zhegalkin polynomial ---------- */
const LUK={"¬":"N","∧":"K","∨":"A","→":"C","↔":"E","⊻":"J","|":"D","↓":"X","←":"B"};
const rpolish=n=>n.t==="var"?n.name:n.t==="const"?(n.v?"⊤":"⊥"):n.t==="not"?rpolish(n.a)+"¬":rpolish(n.a)+rpolish(n.b)+n.op;
const polish=n=>n.t==="var"?n.name:n.t==="const"?(n.v?"⊤":"⊥"):n.t==="not"?"¬"+polish(n.a):n.op+polish(n.a)+polish(n.b);
function lukas(n){ // null if the formula has a connective or constant without a standard letter
  if(n.t==="var")return n.name;
  if(n.t==="const")return null;
  const L_=LUK[n.t==="not"?"¬":n.op];if(!L_)return null;
  const a=lukas(n.a);if(a==null)return null;
  if(n.t==="not")return L_+a;
  const b=lukas(n.b);return b==null?null:L_+a+b;
}
function rlukas(n){ // reverse Polish with Łukasiewicz letters; null in the same cases as lukas()
  if(n.t==="var")return n.name;
  if(n.t==="const")return null;
  const L_=LUK[n.t==="not"?"¬":n.op];if(!L_)return null;
  const a=rlukas(n.a);if(a==null)return null;
  if(n.t==="not")return a+L_;
  const b=rlukas(n.b);return b==null?null:a+b+L_;
}
/* Peirce's alpha graphs in linear form: juxtaposition = conjunction, (…) = cut = negation.
   A formula becomes a list of juxtaposed items; the empty list is the blank sheet (true). */
function peirceItems(n){
  const cut=x=>"("+peirceJoin(x)+")";
  if(n.t==="var")return [n.name];
  if(n.t==="const")return n.v?[]:["()"];
  if(n.t==="not")return [cut(peirceItems(n.a))];
  const A=peirceItems(n.a),B=peirceItems(n.b);
  switch(n.op){
    case "∧":return A.concat(B);
    case "∨":return [cut([cut(A),cut(B)])];
    case "→":return [cut(A.concat([cut(B)]))];
    case "←":return [cut(B.concat([cut(A)]))];
    case "↔":return [cut(A.concat([cut(B)])),cut(B.concat([cut(A)]))];
    case "⊻":return [cut(A.concat(B)),cut([cut(A),cut(B)])];
    case "|":return [cut(A.concat(B))];
    case "↓":return [cut(A),cut(B)];
    case "↛":return A.concat([cut(B)]);
  }
}
// items side by side: a space only between two letters, as in p q, p(q), (p)(q)
function peirceJoin(items){let r="";items.forEach((t,i)=>{if(i&&!/[)]$/.test(r)&&t[0]!=="(")r+=" ";r+=t});return r}
/* the same graph as a tree, for drawing: items are {v:"p"} or {cut:[items]} */
function peirceTree(n){
  const cut=x=>({cut:x});
  if(n.t==="var")return [{v:n.name}];
  if(n.t==="const")return n.v?[]:[cut([])];
  if(n.t==="not")return [cut(peirceTree(n.a))];
  const A=peirceTree(n.a),B=peirceTree(n.b);
  switch(n.op){
    case "∧":return A.concat(B);
    case "∨":return [cut([cut(A),cut(B)])];
    case "→":return [cut(A.concat([cut(B)]))];
    case "←":return [cut(B.concat([cut(A)]))];
    case "↔":return [cut(A.concat([cut(B)])),cut(B.concat([cut(A)]))];
    case "⊻":return [cut(A.concat(B)),cut([cut(A),cut(B)])];
    case "|":return [cut(A.concat(B))];
    case "↓":return [cut(A),cut(B)];
    case "↛":return A.concat([cut(B)]);
  }
}
const peirceTreeSize=items=>items.reduce((a,i)=>a+1+(i.cut?peirceTreeSize(i.cut):0),0);
/* Drawing: juxtaposed items left to right; a cut is an oval (stadium) around its contents;
   everything sits on the sheet of assertion (the outer rectangle). */
function peirceSvg(items){
  const CH=9.2,GAP=10,PADX=12,PADY=8,TXT=20,EMPTY=22;
  const lay=list=>{
    const kids=list.map(it=>{
      if(it.v!=null)return {v:it.v,w:[...it.v].length*CH,h:TXT};

    return ["<table style=\"border-collapse:collapse;font-family:monospace\">","<caption>"+esc(S.model.text)+"</caption>",
      "<thead><tr>"+head.map((v,i)=>cell("th",v,i)).join("")+"</tr></thead>","<tbody>",
      ...rows.map(r=>"<tr>"+r.map((v,i)=>cell("td",v,i)).join("")+"</tr>"),"</tbody>","</table>"].join("\n");
  }
  if(fmt==="md"){
    const md=v=>v.replace(/\|/g,"\\|")||" ";
    return ["| "+head.map(md).join(" | ")+" |","|"+head.map(()=>":-:").join("|")+"|",...rows.map(r=>"| "+r.map(md).join(" | ")+" |")].join("\n");
  }
  if(fmt==="csv"){
    const q=v=>/[",;\n]/.test(v)?"\""+v.replace(/"/g,"\"\"")+"\"":v;
    return [head,...rows].map(r=>r.map(q).join(",")).join("\n");
  }
  // plain text: padded columns, "|" between blocks
  const w=head.map((h,i)=>Math.max([...h].length,...rows.map(r=>[...r[i]].length)));
  const pad=(v,i)=>{const d=w[i]-[...v].length,l=Math.floor(d/2);return " ".repeat(l)+v+" ".repeat(d-l)};
  const join=r=>r.map((v,i)=>(i===0?"":sep[i]==="lr"||sep[i]==="c"?" ‖ ":sep[i]==="g"?" | ":" ")+pad(v,i)).join("");
  const top=join(head);
  return [top,"-".repeat([...top].length),...rows.map(join)].join("\n");
}
const EXT={latex:"tex",html:"html",md:"md",csv:"csv",txt:"txt"},MIME={latex:"text/x-tex",html:"text/html",md:"text/markdown",csv:"text/csv",txt:"text/plain"};
S.expFmt=load("expFmt","latex");
function renderExport(){
  if(!S.model||!$("export-details").open)return;
  $("exp-out").value=exportText(S.expFmt);
  document.querySelectorAll("#exp-fmt [data-fmt]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.fmt===S.expFmt)));
}
$("exp-fmt").addEventListener("click",e=>{const b=e.target.closest("[data-fmt]");if(!b)return;S.expFmt=b.dataset.fmt;save("expFmt",S.expFmt);$("exp-msg").textContent="";renderExport()});
$("export-details").addEventListener("toggle",renderExport);
$("exp-copy").addEventListener("click",()=>{
  const t=$("exp-out"),msg=$("exp-msg");
  const fallback=()=>{t.focus();t.select();msg.textContent=L().exportSelected};
  try{navigator.clipboard.writeText(t.value).then(()=>{msg.textContent=L().exportCopied},fallback)}catch(e){fallback()}
});
$("exp-dl").addEventListener("click",()=>{
  const text=exportText(S.expFmt);
  const blob=new Blob([(S.expFmt==="csv"?"\ufeff":"")+text],{type:MIME[S.expFmt]+";charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="truth-table."+EXT[S.expFmt];
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});

function emptyGrids(){
  const m=S.model,grid=w=>Array.from({length:m.n},()=>Array(w).fill(null));
  S.left=grid(m.vars.length);S.right=grid(m.cols.length);S.rightI=grid(m.islots.length);
}
function reportHref(){
  const lang=L(),f=inp.value||(S.model?S.model.text:"");
  return "mailto:vdolgorukov+truthtable@gmail.com?subject="+encodeURIComponent(lang.reportSubject)+"&body="+encodeURIComponent(lang.reportBody(f));
}
["pointerdown","focus","click"].forEach(ev=>$("report").addEventListener(ev,()=>{$("report").href=reportHref()}));
$("check").addEventListener("click",()=>{S.checked=true;update()});
$("clear").addEventListener("click",()=>{S.checked=false;S.quiz=newQuiz();S.lastFilled=null;emptyGrids();update();saveProgress()});
$("solve").addEventListener("click",()=>{
  const m=S.model;
  for(let r=0;r<m.n;r++){
    const env={};
    m.vars.forEach((v,j)=>{S.left[r][j]=lexVal(r,j);env[v]=S.left[r][j]});
    m.cols.forEach((c,i)=>{S.right[r][i]=ev(c.node,env)});
    m.islots.forEach((x,i)=>{S.rightI[r][i]=ev(x.node,env)});
  }
  S.lastFilled=null;
  S.checked=true;update();saveProgress();
});

/* ---------- settings ---------- */
/* own symbols for true/false: non-empty, different, at most 3 characters */
function applyCustom(){
  SYM.custom=[S.custF,S.custT];
  $("cust-t").value=S.custT;$("cust-f").value=S.custF;
  $("custom-sym").hidden=S.notation!=="custom";
}
["cust-t","cust-f"].forEach(id=>$(id).addEventListener("input",()=>{
  const t=$("cust-t").value.trim(),f=$("cust-f").value.trim(),okv=t&&f&&t!==f;
  $("cust-t").classList.toggle("bad",!okv);$("cust-f").classList.toggle("bad",!okv);
  if(!okv)return;
  S.custT=t;S.custF=f;save("custT",t);save("custF",f);SYM.custom=[f,t];
  syncSegs();buildSemantics();if(S.model)update();
}));
function syncSegs(){
  const val={notation:S.notation,auto:S.auto?"1":"0",order:S.order,layout:S.layout,cols:S.cols,reveal:S.reveal?"1":"0",extraOps:S.extraOps?"1":"0"};
  document.querySelectorAll(".seg[data-set]").forEach(g=>{
    g.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.val===val[g.dataset.set])));
  });
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===S.lang)));
  const [f,t]=SYM[S.notation];
  $("ord-asc").textContent=f+f+f+" → "+t+t+t;
  $("ord-desc").textContent=t+t+t+" → "+f+f+f;
}
document.querySelectorAll(".seg[data-set]").forEach(g=>{
  g.addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    const key=g.dataset.set,v=b.dataset.val;
    if(key==="notation"){S.notation=v;$("custom-sym").hidden=v!=="custom";buildSemantics()}
    if(key==="auto")S.auto=v==="1";
    if(key==="order")S.order=v;
    if(key==="cols")S.cols=v;
    if(key==="layout")S.layout=v;
    if(key==="reveal")S.reveal=v==="1";
    if(key==="extraOps"){S.extraOps=v==="1";save(key,S[key]);applyLang();return}
    save(key,S[key]);syncSegs();
    if(key==="auto"||key==="cols"||key==="layout")renderTable();else update();
  });
});
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{S.lang=b.dataset.lang;save("lang",S.lang);applyLang()}));

/* "Semantics and terms" panel: connective truth tables, definitions, relation table */
const REL_COMBOS=[["±","—","—","±"],["—","±","±","—"],["—","±","±","+"],["+","±","±","—"],["±","—","+","±"],["+","+","+","+"]];
function buildSemantics(){
  const lang=L(),v=b=>"<span class=\"v"+(b?1:0)+"\">"+esc(sym(b))+"</span>";
  const ops=["∧","∨","→","↔","⊻","|","↓"].concat(S.extraOps?["←","↛"]:[]);
  const rows=[[true,true],[true,false],[false,true],[false,false]];
  let h="<h3>"+esc(lang.semConn)+"</h3><p>"+esc(lang.semConnNote)+"</p><div class=\"tw\"><table><thead><tr><th>p</th><th class=\"lt\">q</th><th>¬p</th>"+ops.map(o=>"<th>p"+esc(o)+"q</th>").join("")+"</tr></thead><tbody>";
  rows.forEach(([p,q])=>{h+="<tr><td>"+v(p)+"</td><td class=\"lt\">"+v(q)+"</td><td>"+v(!p)+"</td>"+ops.map(o=>"<td>"+v(OPS[o](p,q))+"</td>").join("")+"</tr>"});
  h+="</tbody></table></div><dl>"+lang.semRead.filter((_,i)=>i<8||S.extraOps).map(t=>{const k=t.indexOf(" — ");return "<div><dt class=\"mono\">"+esc(t.slice(0,k))+"</dt><dd> — "+esc(t.slice(k+3))+"</dd></div>"}).join("")+"</dl>";
  const dl=list=>"<dl>"+list.map(([t,d])=>"<div><dt>"+esc(t)+"</dt><dd> — "+esc(d)+"</dd></div>").join("")+"</dl>";
  h+="<h3>"+esc(lang.semTerms)+"</h3>"+dl(lang.semDefs);
  h+="<h3>"+esc(lang.semEnt)+"</h3>"+dl(lang.semEntDefs);
  const T=SYM[S.notation][1],F=SYM[S.notation][0];
  h+="<h3>"+esc(lang.semRel)+"</h3><p>"+esc(lang.semRelNote)+"</p><div class=\"tw\"><table><thead><tr><th class=\"txt\">"+esc(lang.semRelHead[0])+"</th>"+
    [[T,T],[T,F],[F,T],[F,F]].map(([a,b])=>"<th>A="+esc(a)+", B="+esc(b)+"</th>").join("")+"<th class=\"txt\">"+esc(lang.semRelHead[1])+"</th></tr></thead><tbody>";
  lang.semRelDefs.forEach(([n,d],i)=>{h+="<tr><td class=\"txt\"><b>"+esc(n)+"</b></td>"+REL_COMBOS[i].map(c=>"<td>"+c+"</td>").join("")+"<td class=\"txt\">"+esc(d)+"</td></tr>"});
  $("sem").innerHTML=h+"</tbody></table></div>";
}
function applyLang(){
  const lang=L();
  document.documentElement.lang=S.lang;
  document.title=S.lang==="ru"?"Тренажёр таблиц истинности":"Truth Table Trainer";
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=lang[el.dataset.i18n]});
  $("theme").setAttribute("aria-label",lang.themeLabel);
  let h="<p>"+lang.helpIntro+"</p><div class=\"help-wrap\"><table><thead><tr>"+lang.helpHead.map(x=>"<th>"+esc(x)+"</th>").join("")+"</tr></thead><tbody>";
  HELP_ROWS.forEach((row,i)=>{
    if(row[3]&&!S.extraOps)return;
    const codes=s=>s?s.split(/\s{2,}/).map(x=>"<code>"+esc(x)+"</code>").join(" "):"";
    h+="<tr><td>"+esc(lang.helpNames[i])+"</td><td class=\"sym\">"+esc(row[0])+"</td><td>"+codes(row[1])+"</td><td>"+codes(row[2])+"</td></tr>";
  });
  h+="</tbody></table></div><p>"+lang.helpList+"</p><p>"+lang.helpVars+"</p><p>"+lang.helpPrec+"</p>";
  $("help").innerHTML=h;
  buildSemantics();
  if(S.lang==="en"&&S.notation==="IL"){S.notation="01";save("notation",S.notation)}
  applyCustom();
  document.querySelector("[data-set=notation] [data-val=IL]").hidden=S.lang==="en";
  buildKeys();buildExamples();syncSegs();
  if(S.model)renderTable();
  renderPreview();
}

document.querySelectorAll(".drawer-btn").forEach(b=>{
  const k=b.dataset.panel,p=$("panel-"+k);
  const set=open=>{b.setAttribute("aria-expanded",String(open));p.hidden=!open;save("open-"+k,open)};

/* ---------- theme: auto (system) / light / dark ---------- */
function applyTheme(t){
  if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themeSet===(t||"auto"))));
  save("theme",t||"auto");
}
document.querySelectorAll("[data-theme-set]").forEach(b=>b.addEventListener("click",()=>applyTheme(b.dataset.themeSet)));
applyTheme(load("theme","auto"));

$("share").addEventListener("click",()=>{
  const b=$("share"),url=taskUrl(S.model.text);
  const say=t=>{b.textContent=t;setTimeout(()=>{b.textContent=L().share},1800)};
  try{navigator.clipboard.writeText(url).then(()=>say(L().shareDone),()=>say(L().shareFail))}catch(e){say(L().shareFail)}
});

/* ---------- start ---------- */
// a formula in the address (?f=…) wins over the one remembered in this browser
const linkF=(()=>{try{return new URLSearchParams(location.search).get("f")}catch(e){return null}})();
inp.value=liveNorm(linkF!=null?linkF:load("formula","(p→q)∧¬r"));
applyLang();
if(linkF!=null)S.showErr=true;
let ast=renderPreview();
if(ast){setModel(buildModel(ast),load("progress",null));if(linkF!=null)save("formula",inp.value)}
else{ // a broken formula: show its error, keep the address, build the default table underneath
  const bad=inp.value,href=location.href;inp.value="(p→q)∧¬r";setModel(buildModel(renderPreview()),null);
  inp.value=bad;renderPreview();try{history.replaceState(null,"",href)}catch(e){}
}
})();
